[options]
; --- Database ---
; Home server ("homebox") variant of odoo.conf: the shared postgresql
; container on the external `main` network replaces the compose-internal `db`
; service. db_password stays absent -- the odoo image entrypoint injects it
; from the PASSWORD/PGPASSWORD environment variables in
; docker-compose.homebox.yml.
db_host = postgresql
db_port = 5432
db_user = odoo
db_name = odoo
; db_template = template0
db_maxconn = 64
; Single-database deployment: reject requests for any other db.
dbfilter = ^odoo$

; --- Paths ---
addons_path = /mnt/extra-addons,/opt/odoo_addons
data_dir = /var/lib/odoo

; --- Network ---
http_port = 8069
gevent_port = 8072
http_interface = 0.0.0.0
proxy_mode = True

; --- Workers ---
; Homebox values (this host runs more than odoo, but has more headroom than
; the docker-compose.yml target): 8 workers / 2 cron, 2G soft / 4G hard caps.
workers = 8
max_cron_threads = 2
limit_memory_soft = 2147483648
limit_memory_hard = 4294967296
; 600s aligns with long report generation / knowledge extraction; the homebox
; nginx allows 720s, so workers give up first and return a clean error.
limit_time_cpu = 600
limit_time_real = 600
limit_request = 8192

; --- Logging ---
; Empty logfile = stdout, collected by docker's json-file driver (rotation
; configured in docker-compose.homebox.yml).
log_level = info

; --- Security ---
; admin_passwd gates the service=db RPC (create/drop/restore). Since 19.0 it is
; a file-only option holding a HASH -- same hash as odoo.conf (plaintext lives
; in that deployment's .env).
admin_passwd = $pbkdf2-sha512$600000$W.tdyxnDGKN0LkUIoZTSGg$fBtg1HV1.Go16OMBpzqcR6kMcErYxaMaMHVk7w093LsOjNaMg6pKSVAg0.Xhja7MV8Bdv40iFTCwGryl0MAUAQ
list_db = False
; queue_job must be loaded server-wide for the in-process job runner to start.
server_wide_modules = base,web,queue_job

; --- Misc ---
; "all" only affects fresh database initialization: no demo data.
without_demo = all

[queue_job]
; channels 定义各通道的并发上限。root:N 是全局上限。
;
; root.infohub.arxiv 必须是 1：arXiv 要求约 3 秒一次请求，而限速是按来源方计的。
; 会存在多个 arXiv 源（cs.LG、cs.CV、math.AP…），它们是独立的源记录，queue_job 的
; identity_key 只保证同一个源不并发，无法阻止多个 arXiv 源同时出网合计超速。
; 容量 1 把该来源方的全部任务串成一条队列，配合任务内的 min_request_interval 休眠，
; 就不需要自建分布式令牌桶。
;
; 漏掉 root.infohub.arxiv:1 不会报错，但限速会静默失效，可能导致 arXiv 封禁 IP。
; 详见 infohub_arxiv 模块说明与 .kiro/specs/infohub/decisions.md 的 ADR-012。
channels = root:2,root.one_storage:1,root.infohub:2,root.infohub.arxiv:1
