# Edge proxy for Odoo. HTTP only -- TLS terminates at the upstream layer (cloud
# LB / CDN / outer proxy). $forwarded_proto passes the client-visible scheme
# through to Odoo (proxy_mode), falling back to $scheme when no outer proxy set
# the header.
#
# Cache-Control / security headers (nosniff, X-Frame-Options) and asset cache
# policies are set by Odoo itself and passed through untouched -- adding them
# here would only produce duplicated headers.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream odoo_http {
    server odoo:8069;
    keepalive 32;
}

upstream odoo_gevent {
    server odoo:8072;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;

    location /websocket {
        proxy_pass http://odoo_gevent;
        proxy_http_version 1.1;
        # Any proxy_set_header here disables server-level inheritance, so the
        # full set is repeated.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://odoo_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/json application/javascript text/xml application/xml image/svg+xml;
}
