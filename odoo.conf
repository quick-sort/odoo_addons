[options]
; --- Database ---
; db_password is deliberately absent: the odoo image entrypoint injects it as a
; CLI argument from the PASSWORD/PGPASSWORD environment variables set in
; docker-compose.yml (value lives in .env, never in git). Keeping the key out
; of this file also means the entrypoint never needs to rewrite it, so the file
; can stay mounted read-only.
db_host = db
db_port = 5432
db_user = odoo
db_name = odoo
; db_template = template0
db_maxconn = 64
; Single-database deployment: reject requests for any other db.
dbfilter = ^odoo$

; --- Paths ---
addons_path = /mnt/extra-addons,/opt/odoo_addons
data_dir = /var/lib/odoo

; --- Network ---
http_port = 8069
gevent_port = 8072
http_interface = 0.0.0.0
proxy_mode = True

; --- Workers (0 = multi-thread mode, >0 = multi-process) ---
workers = 2
max_cron_threads = 1
; Per-worker memory caps. Tune together with the odoo container's mem_limit
; (roughly workers * limit_memory_hard + headroom).
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736
; 600s aligns with long report generation / knowledge extraction; nginx allows
; 720s, so workers give up first and return a clean error.
limit_time_cpu = 600
limit_time_real = 600
; limit_time_real_cron = -1
limit_request = 8192

; --- Logging ---
; Empty logfile = stdout, collected by docker's json-file driver (rotation
; configured in docker-compose.yml).
log_level = info
; log_handler = :INFO
; logfile = None
; log_db = False

; --- Security ---
; admin_passwd gates the service=db RPC (create/drop/restore). Since 19.0 it is
; a file-only option holding a HASH -- a plaintext default would still verify,
; so a random password is hashed here. Plaintext is recorded in .env
; (ODOO_ADMIN_PASSWD). Rotate with:
;   docker compose exec odoo python3 -c \
;     "from odoo.tools.config import crypt_context; print(crypt_context.hash('NEW_PW'))"
admin_passwd = $pbkdf2-sha512$600000$W.tdyxnDGKN0LkUIoZTSGg$fBtg1HV1.Go16OMBpzqcR6kMcErYxaMaMHVk7w093LsOjNaMg6pKSVAg0.Xhja7MV8Bdv40iFTCwGryl0MAUAQ
list_db = False
; queue_job must be loaded server-wide for the in-process job runner to start.
server_wide_modules = base,web,queue_job

; --- Email ---
; smtp_server = localhost
; smtp_port = 25
; smtp_ssl = False
; smtp_user = False
; smtp_password = False
; email_from = False

; --- Performance ---
; osv_memory_count_limit = 0
; osv_memory_age_limit = 1.0
; transient_age_limit = 1.0

; --- CSV / Import ---
; csv_internal_sep = ,
; import_partial =

; --- Misc ---
; "all" only affects fresh database initialization: no demo data.
without_demo = all
; test_enable = False
; screencasts =
; screenshots = /tmp/odoo_tests

; --- queue_job ---
; The in-process job runner starts only when workers > 0 (multi-process mode)
; or server_wide_modules contains queue_job (in-thread mode). channels defines
; the worker pool: "root:N" allows N concurrent jobs across the default channel.
; Long-running scans (dataset.scan_chunks) use the default channel; bump N if
; you expect concurrent scans on different datasets.
[queue_job]
; channels 定义各通道的并发上限。root:N 是全局上限。
;
; root.infohub.arxiv 必须是 1：arXiv 要求约 3 秒一次请求，而限速是按来源方计的。
; 会存在多个 arXiv 源（cs.LG、cs.CV、math.AP…），它们是独立的源记录，queue_job 的
; identity_key 只保证同一个源不并发，无法阻止多个 arXiv 源同时出网合计超速。
; 容量 1 把该来源方的全部任务串成一条队列，配合任务内的 min_request_interval 休眠，
; 就不需要自建分布式令牌桶。
;
; 漏掉 root.infohub.arxiv:1 不会报错，但限速会静默失效，可能导致 arXiv 封禁 IP。
; 详见 infohub_arxiv 模块说明与 .kiro/specs/infohub/decisions.md 的 ADR-012。
channels = root:2,root.one_storage:1,root.infohub:2,root.infohub.arxiv:1
; scheme = http
; host = localhost
; port = 8069
; http_auth_user =
; http_auth_password =
