[project]
name = "agenthub-relay"
version = "0.1.0"
description = "Realtime relay for AgentHub: connections, routing, queues, record feed"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
agenthub-relay = "agenthub_relay.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthub_relay"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
